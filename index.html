<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora</title>

<style>
  :root {
    --paper: #F7F7F3;
    --ink: #1B1F1D;
    --muted: #5B615C;
    --accent: #2F6F4E;
    --key-bg: #FFFFFF;
    --key-border: #D9D7CC;
    --op-bg: #2F6F4E;
    --op-text: #FFFFFF;
    --screen-bg: #12171B;
    --screen-text: #CFE8D9;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181A;
      --ink: #E9ECE9;
      --muted: #A9B0AA;
      --accent: #6FBF97;
      --key-bg: #1D2224;
      --key-border: #2A2F2C;
      --op-bg: #2F6F4E;
      --op-text: #E9ECE9;
      --screen-bg: #0C1012;
      --screen-text: #CFE8D9;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: Arial, sans-serif;
  }

  .calculadora {
    width: 320px;
    max-width: 92vw;
    padding: 20px;
    border-radius: 18px;
    border: 1px solid var(--key-border);
    background: var(--paper);
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 13px 3px;
  }

  #pantalla {
    background: var(--screen-bg);
    color: var(--screen-text);
    border-radius: 12px;
    padding: 22px 15px;
    text-align: right;
    font-family: Consolas, monospace;
    font-size: 32px;
    margin-bottom: 14px;
    overflow-x: auto;
    white-space: nowrap;
    min-height: 55px;
  }

  /*
    Se utiliza flex en lugar de grid para que la calculadora
    también funcione correctamente en navegadores antiguos.
  */
  .teclas {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
  }

  button {
    width: calc(25% - 6px);
    height: 54px;
    margin: 3px;
    padding: 0;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid var(--key-border);
    background: var(--key-bg);
    color: var(--ink);
    cursor: pointer;
    font-family: Arial, sans-serif;
  }

  button:active {
    opacity: 0.75;
  }

  button.operador {
    background: var(--op-bg);
    color: var(--op-text);
    border-color: var(--op-bg);
  }

  /*
    Estos botones ocupan dos espacios.
  */
  button.doble {
    width: calc(50% - 6px);
  }

  button.igual {
    width: calc(50% - 6px);
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }
</style>
</head>

<body>

<div class="calculadora">

  <h1>Calculadora</h1>

  <div id="pantalla">0</div>

  <div class="teclas">

    <button onclick="limpiar()">C</button>
    <button onclick="borrarUltimo()">←</button>
    <button class="operador" onclick="calcularRaiz()">√</button>
    <button class="operador" onclick="agregarOperador('/')">÷</button>

    <button onclick="agregarDigito('7')">7</button>
    <button onclick="agregarDigito('8')">8</button>
    <button onclick="agregarDigito('9')">9</button>
    <button class="operador" onclick="agregarOperador('*')">×</button>

    <button onclick="agregarDigito('4')">4</button>
    <button onclick="agregarDigito('5')">5</button>
    <button onclick="agregarDigito('6')">6</button>
    <button class="operador" onclick="agregarOperador('-')">−</button>

    <button onclick="agregarDigito('1')">1</button>
    <button onclick="agregarDigito('2')">2</button>
    <button onclick="agregarDigito('3')">3</button>
    <button class="operador" onclick="agregarOperador('+')">+</button>

    <button onclick="agregarDigito('0')">0</button>
    <button onclick="agregarDigito('.')">.</button>
    <button class="igual" onclick="calcular()">=</button>

  </div>

</div>

<script>

  let expresion = '';

  const pantalla = document.getElementById('pantalla');


  function actualizarPantalla() {
    pantalla.textContent = expresion === '' ? '0' : expresion;
  }


  function agregarDigito(digito) {

    const partes = expresion.split(/[\+\-\*\/]/);
    const numeroActual = partes[partes.length - 1];

    if (digito === '.') {
      if (numeroActual.indexOf('.') !== -1) {
        return;
      }
    } else if (numeroActual === '0') {
      /*
        Evita ceros a la izquierda (ej: '05' pasa a '5' y '00' se mantiene como '0').
      */
      if (digito === '0') {
        return;
      }
      expresion = expresion.slice(0, -1) + digito;
      actualizarPantalla();
      return;
    }

    expresion += digito;
    actualizarPantalla();
  }


  function agregarOperador(operador) {

    if (expresion === '') {
      return;
    }

    const ultimoCaracter = expresion.slice(-1);

    if ('+-*/'.indexOf(ultimoCaracter) !== -1) {

      expresion = expresion.slice(0, -1) + operador;

    } else {

      expresion += operador;
    }

    actualizarPantalla();
  }


  function borrarUltimo() {

    expresion = expresion.slice(0, -1);

    actualizarPantalla();
  }


  function limpiar() {

    expresion = '';

    actualizarPantalla();
  }


  /*
    FUNCIÓN NUEVA: RAÍZ CUADRADA

    Primero toma el número que está en la pantalla.
    Después utiliza Math.sqrt() para calcular su raíz.
  */
  function calcularRaiz() {

    if (expresion === '') {
      return;
    }

    try {

      /*
        Solo aceptamos números, puntos y operadores básicos.
      */
      if (!/^[0-9.+\-*/]+$/.test(expresion)) {
        throw new Error('Expresión inválida');
      }

      /*
        Primero calculamos la operación que esté escrita.

        Ejemplo:

        9 + 7 = 16
      */
      const resultadoPrevio =
        Function('"use strict"; return (' + expresion + ')')();

      /*
        No se puede calcular una raíz cuadrada real
        de un número negativo.
      */
      if (!isFinite(resultadoPrevio) || resultadoPrevio < 0) {
        throw new Error('Raíz inválida');
      }

      /*
        Calculamos la raíz cuadrada y redondeamos a 14 dígitos
        para evitar desbordamiento de decimales.
      */
      const resultado = parseFloat(Math.sqrt(resultadoPrevio).toFixed(14));

      expresion = String(resultado);

      actualizarPantalla();

    } catch (error) {

      pantalla.textContent = 'Error';

      expresion = '';
    }
  }


  function calcular() {

    if (expresion === '') {
      return;
    }

    try {

      /*
        Solo permitimos números, puntos y operadores básicos.
      */
      if (!/^[0-9.+\-*/]+$/.test(expresion)) {
        throw new Error('Expresión inválida');
      }

      const resultado =
        Function('"use strict"; return (' + expresion + ')')();

      /*
        Evitamos resultados inválidos como dividir entre cero.
      */
      if (!isFinite(resultado)) {
        throw new Error('División entre cero');
      }

      /*
        Redondeamos a 14 dígitos para evitar desbordamiento de decimales.
      */
      expresion = String(parseFloat(resultado.toFixed(14)));

      actualizarPantalla();

    } catch (error) {

      pantalla.textContent = 'Error';

      expresion = '';
    }
  }

</script>

</body>
</html>
